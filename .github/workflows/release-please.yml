name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to recover (for example v0.1.0)
        type: string
        required: true
      recovery_run_id:
        description: Optional prior run ID containing the exact release dist artifact
        type: string
        default: ''
      publisher:
        description: Publisher to retry
        type: choice
        options: [all, binaries, docker]
        default: all

permissions: {}

# This caller holds the lock for the entire reusable publication workflow.
# Do not take the same lock inside publish.yml (that would deadlock).
concurrency:
  group: repository-release
  cancel-in-progress: false

jobs:
  ci:
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v4.4.1
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: [ci, release]
    if: needs.release.outputs.created == 'true'
    permissions:
      contents: write
      packages: write
      actions: read
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      sha: ${{ needs.release.outputs.sha }}
      validated_sha: ${{ github.sha }}
      publisher: all

  recover:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
      actions: read
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ inputs.tag }}
      publisher: ${{ inputs.publisher }}
      recovery_run_id: ${{ inputs.recovery_run_id }}
