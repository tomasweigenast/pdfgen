name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
      - run: staticcheck ./...

  build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Ghostscript (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ghostscript
      - name: Install Ghostscript (macOS)
        if: runner.os == 'macOS'
        run: brew install ghostscript
      # Ghostscript 10.08.0 no longer honors /S by itself. The Chocolatey
      # package uses AutoHotkey to advance through the installer's dialogs.
      - name: Install Ghostscript (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $maxAttempts = 5
          $installed = $false

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            $output = & choco install ghostscript.app --version=10.8.0 --yes --no-progress --execution-timeout=300 2>&1
            $exitCode = $LASTEXITCODE
            $output | ForEach-Object { Write-Host $_ }

            if ($exitCode -eq 0) {
              $installed = $true
              break
            }

            # Only retry the transient Chocolatey feed outage seen in CI.
            if (($output -join "`n") -notmatch '503\s*\(Service Unavailable\)') {
              throw "Chocolatey Ghostscript install failed with exit code $exitCode"
            }
            if ($attempt -eq $maxAttempts) {
              throw "Chocolatey feed returned HTTP 503 on all $maxAttempts attempts"
            }

            $delay = [Math]::Min(5 * [Math]::Pow(2, $attempt - 1), 60)
            Write-Host "Chocolatey feed returned HTTP 503; retrying in $delay seconds (attempt $($attempt + 1) of $maxAttempts)."
            Start-Sleep -Seconds $delay
          }

          if (-not $installed) {
            throw 'Chocolatey did not install Ghostscript'
          }

          $bin = Join-Path $env:ProgramFiles 'gs\gs10.08.0\bin'
          $executable = Join-Path $bin 'gswin64c.exe'
          if (-not (Test-Path $executable)) {
            throw "Ghostscript executable was not found at $executable"
          }

          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: gs --version
        if: runner.os != 'Windows'
      - name: Verify Ghostscript (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (& gswin64c --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne '10.08.0') {
            throw "Expected Ghostscript 10.08.0, got '$version'"
          }
      - run: go test ./...
        if: runner.os != 'Windows'
      - run: go test ./...
        if: runner.os == 'Windows'

  # Exercise the release configuration and all six archives without publishing.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test .github/scripts/release.test.mjs
      - name: Validate workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint -shellcheck=''
      - name: Validate Release Please schema and version policy
        env:
          RELEASE_TOOLS: ${{ runner.temp }}/release-tools
        run: |
          npm install --prefix "$RELEASE_TOOLS" --no-audit --no-fund release-please@17.3.0 ajv-cli@5.0.0 ajv-formats@3.0.1
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/googleapis/release-please/v17.3.0/schemas/config.json -o "$RELEASE_TOOLS/schema.json"
          "$RELEASE_TOOLS/node_modules/.bin/ajv" validate -s "$RELEASE_TOOLS/schema.json" -d release-please-config.json -c ajv-formats --strict=false
          node .github/scripts/release-policy.test.cjs
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.3
          args: check
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.3
          args: release --snapshot --clean
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshot-${{ inputs.ref || github.sha }}
          path: dist/
          retention-days: 7

  # Cross-build both Linux targets, then run the native image against a small document.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/pdfgen.oci.tar
          cache-from: type=gha,scope=container
          cache-to: type=gha,mode=max,scope=container
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pdfgen:test
          cache-from: type=gha,scope=container
      - name: Smoke test runtime
        run: bash .github/scripts/container-smoke.sh

  result:
    name: CI result
    if: always()
    needs: [lint, build, test, packaging, container]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e 'if (Object.values(JSON.parse(process.env.RESULTS)).some(j => j.result !== "success")) process.exit(1)'
