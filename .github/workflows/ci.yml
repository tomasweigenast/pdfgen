name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
      - run: staticcheck ./...

  build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Ghostscript (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ghostscript
      - name: Install Ghostscript (macOS)
        if: runner.os == 'macOS'
        run: brew install ghostscript
      # Download the official installer directly; Chocolatey's Ghostscript feed returned 503.
      - name: Install Ghostscript (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = '10.08.0'
          $installerName = 'gs10080w64.exe'
          $installer = Join-Path $env:RUNNER_TEMP $installerName
          $url = "https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10080/$installerName"
          $expectedSha512 = 'cb3ecc798508851ba28b05e3fb914ddefe78168190726376d8581546ce61d5b216ffa3359e6f829072786bc12350501c7b6f99110d578696b87213d157774269'

          Invoke-WebRequest -Uri $url -OutFile $installer
          $actualSha512 = (Get-FileHash $installer -Algorithm SHA512).Hash.ToLowerInvariant()
          if ($actualSha512 -ne $expectedSha512) {
            throw "Ghostscript installer checksum mismatch: $actualSha512"
          }

          $process = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Ghostscript installer exited with code $($process.ExitCode)"
          }

          $bin = Join-Path $env:ProgramFiles "gs\gs$version\bin"
          if (-not (Test-Path (Join-Path $bin 'gswin64c.exe'))) {
            throw "Ghostscript was not installed in $bin"
          }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: gs --version
        if: runner.os != 'Windows'
      - run: gswin64c --version
        if: runner.os == 'Windows'
      - run: go test ./...

  # Exercise the release configuration and all six archives without publishing.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test .github/scripts/release.test.mjs
      - name: Validate workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint -shellcheck=''
      - name: Validate Release Please schema and version policy
        env:
          RELEASE_TOOLS: ${{ runner.temp }}/release-tools
        run: |
          npm install --prefix "$RELEASE_TOOLS" --no-audit --no-fund release-please@17.3.0 ajv-cli@5.0.0 ajv-formats@3.0.1
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/googleapis/release-please/v17.3.0/schemas/config.json -o "$RELEASE_TOOLS/schema.json"
          "$RELEASE_TOOLS/node_modules/.bin/ajv" validate -s "$RELEASE_TOOLS/schema.json" -d release-please-config.json -c ajv-formats --strict=false
          node .github/scripts/release-policy.test.cjs
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.3
          args: check
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.3
          args: release --snapshot --clean
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshot-${{ inputs.ref || github.sha }}
          path: dist/
          retention-days: 7

  # Cross-build both Linux targets, then run the native image against a small document.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/pdfgen.oci.tar
          cache-from: type=gha,scope=container
          cache-to: type=gha,mode=max,scope=container
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pdfgen:test
          cache-from: type=gha,scope=container
      - name: Smoke test runtime
        run: bash .github/scripts/container-smoke.sh

  result:
    name: CI result
    if: always()
    needs: [lint, build, test, packaging, container]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e 'if (Object.values(JSON.parse(process.env.RESULTS)).some(j => j.result !== "success")) process.exit(1)'
